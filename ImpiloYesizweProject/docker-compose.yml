
services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: impilo-sql

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password@123"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

  web:
    build: .
    container_name: impilo-web

    depends_on:
      - sqlserver

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=ImpiloYesizweDB;User Id=sa;Password=Password@123;TrustServerCertificate=True;"

volumes:
  sql_data: